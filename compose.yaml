# Everything local, nothing to pay for: `docker compose up -d --build`, then http://localhost:3600
services:
  # Qwen2.5-3B-Instruct on the CPU with an OpenAI-compatible API. Downloads ~2 GB on first start.
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-b11561
    command:
      - --hf-repo
      - Qwen/Qwen2.5-3B-Instruct-GGUF
      - --hf-file
      - qwen2.5-3b-instruct-q4_k_m.gguf
      - --ctx-size
      - "8192"
      - --jinja
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    volumes:
      - llm_models:/root/.cache
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.2
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      args:
        EXTRAS: ${BACKEND_EXTRAS:-}
    env_file: ./backend/.env
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-http://llm:8080/v1}
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: sqlite:////app/data/deskpilot.db
      CHECKPOINT_PATH: /app/data/checkpoints.db
    volumes:
      - backend_data:/app/data
    ports:
      - "127.0.0.1:8600:8600" # API docs at http://localhost:8600/docs
    depends_on:
      - llm
      - qdrant
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8600
    ports:
      - "127.0.0.1:3600:3600"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  llm_models:
    # Set LLM_MODELS_VOLUME in a .env next to this file to reuse a volume that already holds the model.
    name: ${LLM_MODELS_VOLUME:-deskpilot_llm_models}
  qdrant_data:
  backend_data:
